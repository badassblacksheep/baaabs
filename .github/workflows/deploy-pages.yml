name: Publish BAAABS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Check road-width invariant and study status
        run: |
          python3 -m unittest discover -s tests -p 'test_road_width.py'
          python3 tools/check-road-width.py --write
          git diff --exit-code -- site/assets/road-width-status.json site/panels.html site/subframe.html site/panel-mounting.html
      - name: Check lightweight concept comparison
        run: |
          python3 -m unittest discover -s tests -p 'test_frame_comparison.py'
          node --test tests/frame-comparison.test.mjs
          python3 tools/build-frame-comparison.py
          git diff --exit-code -- site/assets/frame-comparison.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

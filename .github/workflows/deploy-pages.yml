name: Publish BAAABS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Check road-width invariant and study status
        run: |
          python3 -m unittest discover -s tests -p 'test_road_width.py'
          python3 tools/check-road-width.py --write
          git diff --exit-code -- site/assets/road-width-status.json site/panels.html site/subframe.html site/panel-mounting.html
      - name: Check lightweight concept comparison
        run: |
          python3 -m unittest discover -s tests -p 'test_frame_comparison.py'
          node --test tests/frame-comparison.test.mjs
          python3 tools/build-frame-comparison.py
          git diff --exit-code -- site/assets/frame-comparison.json
      - name: Check individual interior support study
        run: |
          python3 -m unittest discover -s tests -p 'test_interior_supports.py'
          node --test tests/interior-supports.test.mjs
          python3 tools/build-interior-support-study.py
          git diff --exit-code -- site/assets/interior-support-study.json
      - name: Build and verify animated eye model
        run: |
          python3 -m pip install "numpy>=2.0,<3"
          python3 tools/build-animated-eyes.py
          python3 -m unittest discover -s tests -p 'test_animated_eyes.py'
          python3 -m unittest discover -s tests -p 'test_dj_booth.py'
          python3 -m unittest discover -s tests -p 'test_panel_coverage.py'
          python3 tools/build-dj-register.py --check
          node --test tests/dj-workshop.test.mjs tests/home-dj.test.mjs
      - name: Check structural report and workshop revision
        run: node --test tests/structural-report.test.mjs tests/structural05.test.mjs tests/structural05a.test.mjs tests/structural06.test.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage public pages without retired donor studies
        run: |
          rsync -a --exclude-from=tools/retired-pages.txt site/ pages-dist/
          rsync -a fonts/ pages-dist/fonts/
      - name: Build the X-braced panel workshop model
        run: |
          python3 tools/build-workshop-roof.py site/assets/models/baaabs-earl-symmetric-workshop.glb pages-dist/assets/models/baaabs-earl-x-braced-workshop.glb
      - name: Bake the current six-shore model
        run: |
          node tools/bake-structural06.mjs pages-dist/assets/models/baaabs-earl-iteration06-six-shores.glb
          node tools/bake-drive-model.mjs --check pages-dist/assets/models/baaabs-earl-iteration06-six-shores.glb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/make-eye-blender.py
      - name: Export and reopen the editable Blender assembly
        run: |
          python -m pip install 'bpy==5.2.2'
          python tools/make-eye-blender.py -- pages-dist/assets/models/baaabs-earl-iteration06-six-shores.glb pages-dist/assets/models/BAAABS-Animated-Eyes.blend
      - uses: actions/upload-artifact@v4
        with:
          name: baaabs-dj-blender
          path: pages-dist/assets/models/BAAABS-Animated-Eyes.blend
          compression-level: 0
      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-attempt-${{ github.run_attempt }}
          path: pages-dist
      # Pages can see the completed upload before its artifact is indexed.
      - name: Wait for the Pages artifact to be indexed
        run: sleep 20
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-attempt-${{ github.run_attempt }}

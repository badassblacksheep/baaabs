name: Publish BAAABS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_model_rebuild:
        description: Rebuild generated GLB and Blender assets even on a cache hit
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      MODEL_BUILD_DIR: .generated-models
      ANIMATED_EYE_MODEL: site/assets/models/earl-animated-eyes.glb
      WORKSHOP_MODEL: baaabs-earl-x-braced-workshop.glb
      STRUCTURAL_MODEL: baaabs-earl-iteration06-six-shores.glb
      BLENDER_MODEL: BAAABS-Animated-Eyes.blend
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Check generated site configuration
        run: node tools/sync-site-config.mjs --check
      # Exact matches only: cached outputs must belong to these model inputs.
      # Include the workflow so toolchain or build-command changes invalidate the cache.
      - name: Restore generated model assets
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANIMATED_EYE_MODEL }}
            ${{ env.MODEL_BUILD_DIR }}
          key: model-assets-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/deploy-pages.yml', 'tools/build-animated-eyes.py', 'tools/dj_booth.py', 'tools/infernal_eyes.py', 'tools/hypnotoad_eyes.py', 'tools/build-workshop-roof.py', 'tools/glb_bounds.py', 'tools/bake-structural06.mjs', 'tools/make-eye-blender.py', 'site/assets/models/earl-roof-attachment-study.glb', 'site/assets/models/baaabs-earl-symmetric-workshop.glb', 'site/assets/structural-models-06.json', 'site/assets/structural-preview-06.js', 'site/assets/earl-panel-layout.json') }}
      - name: Determine whether models require rebuilding
        id: model-build
        env:
          CACHE_HIT: ${{ steps.model-cache.outputs.cache-hit }}
          FORCE_REBUILD: ${{ inputs.force_model_rebuild || false }}
        shell: bash
        run: |
          set -euo pipefail
          rebuild=false
          reason="exact cache hit; all generated files present"
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            rebuild=true
            reason="manual override"
          elif [[ "$CACHE_HIT" != "true" ]]; then
            rebuild=true
            reason="model dependency cache miss"
          elif [[ ! -s "$ANIMATED_EYE_MODEL" || ! -s "$MODEL_BUILD_DIR/$WORKSHOP_MODEL" || ! -s "$MODEL_BUILD_DIR/$STRUCTURAL_MODEL" || ! -s "$MODEL_BUILD_DIR/$BLENDER_MODEL" ]]; then
            rebuild=true
            reason="one or more generated files missing or empty"
          fi
          echo "rebuild_models=$rebuild" >> "$GITHUB_OUTPUT"
          echo "REBUILD_MODELS=$rebuild ($reason)"
          printf '### Model assets\n\nREBUILD_MODELS=%s — %s\n' "$rebuild" "$reason" >> "$GITHUB_STEP_SUMMARY"
      - name: Install numerical test dependencies
        run: python3 -m pip install "numpy>=2.0,<3"
      - name: Build animated eye model
        if: steps.model-build.outputs.rebuild_models == 'true'
        run: python3 tools/build-animated-eyes.py
      # Keep the checks on every push, even when the generated assets are reused.
      # Retired station, frame-comparison and individual cabin-post studies are archival.
      - name: Verify animated eye model, DJ booth and panel register
        run: |
          python3 -m unittest discover -s tests -p 'test_animated_eyes.py'
          python3 -m unittest discover -s tests -p 'test_dj_booth.py'
          python3 -m unittest discover -s tests -p 'test_panel_coverage.py'
          python3 tools/build-dj-register.py --check
          node --test tests/dj-workshop.test.mjs tests/home-dj.test.mjs
      - name: Check structural report and workshop revision
        run: node --test tests/structural-report.test.mjs tests/structural05.test.mjs tests/structural05a.test.mjs tests/structural06.test.mjs
      - name: Build workshop and six-shore models
        if: steps.model-build.outputs.rebuild_models == 'true'
        run: |
          mkdir -p "$MODEL_BUILD_DIR"
          python3 tools/build-workshop-roof.py site/assets/models/baaabs-earl-symmetric-workshop.glb "$MODEL_BUILD_DIR/$WORKSHOP_MODEL"
          node tools/bake-structural06.mjs "$MODEL_BUILD_DIR/$STRUCTURAL_MODEL"
      - name: Verify test-drive geometry
        run: node tools/bake-drive-model.mjs --check "$MODEL_BUILD_DIR/$STRUCTURAL_MODEL"
      - uses: actions/setup-python@v5
        if: steps.model-build.outputs.rebuild_models == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/make-eye-blender.py
      - name: Export and reopen the editable Blender assembly
        if: steps.model-build.outputs.rebuild_models == 'true'
        run: |
          python -m pip install 'bpy==5.2.2'
          python tools/make-eye-blender.py -- "$MODEL_BUILD_DIR/$STRUCTURAL_MODEL" "$MODEL_BUILD_DIR/$BLENDER_MODEL"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage public pages without retired donor studies
        run: |
          rsync -a --exclude-from=tools/retired-pages.txt site/ pages-dist/
          python3 tools/stage-asset-aliases.py pages-dist
          for asset in "$WORKSHOP_MODEL" "$STRUCTURAL_MODEL" "$BLENDER_MODEL"; do
            test -s "$MODEL_BUILD_DIR/$asset"
            cp "$MODEL_BUILD_DIR/$asset" pages-dist/assets/models/
          done
          test -s "pages-dist/${ANIMATED_EYE_MODEL#site/}"
      - uses: actions/upload-artifact@v4
        with:
          name: baaabs-dj-blender
          path: pages-dist/assets/models/${{ env.BLENDER_MODEL }}
          compression-level: 0
      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-attempt-${{ github.run_attempt }}
          path: pages-dist
      # Pages can see the completed upload before its artifact is indexed.
      - name: Wait for the Pages artifact to be indexed
        run: sleep 20
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-attempt-${{ github.run_attempt }}
